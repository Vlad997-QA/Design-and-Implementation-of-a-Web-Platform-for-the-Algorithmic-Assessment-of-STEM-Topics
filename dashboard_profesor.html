<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panou Profesor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-700 mb-6">Panou de Control - Profesor</h1>
        <p class="mb-8 text-gray-600">Autentificat ca: <strong>{{ session['username'] }}</strong> | <a href="/logout" class="text-red-500 font-bold">Ieșire</a></p>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8 border-t-4 border-blue-500">
            <h2 class="text-xl font-bold mb-4">Adaugă o sarcină nouă (Configurare Barem)</h2>
            
            <!-- ATENȚIE: Am adăugat enctype="multipart/form-data" ca să suporte fișiere! -->
            <form action="/profesor" method="POST" enctype="multipart/form-data" class="space-y-4">
                <div>
                    <label class="block font-semibold text-gray-700">Titlul Temei</label>
                    <input type="text" name="titlu" required placeholder="Ex: Ecuația de gradul 1" class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700">Tip Evaluare</label>
                    <select name="tip_evaluare" class="w-full border p-2 rounded mt-1 bg-white">
                        <option value="matematica">Matematică / Fizică (OCR & SymPy)</option>
                        <option value="informatica">Informatică (Cod Python)</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-4 border p-4 rounded bg-gray-50">
                    <div>
                        <label class="block font-semibold text-gray-700">Opțiunea 1: Barem Text</label>
                        <input type="text" name="output_asteptat" placeholder="Ex: 3*x" class="w-full border p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="block font-semibold text-blue-700">Opțiunea 2: Barem din Poză (Nou!)</label>
                        <input type="file" name="barem_poza" accept=".png, .jpg, .jpeg" class="w-full border p-1 rounded mt-1 bg-white">
                        <p class="text-xs text-gray-500 mt-1">Platforma va extrage automat textul din poză folosind OCR.</p>
                    </div>
                </div>

                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 shadow-md">Salvează Tema</button>
            </form>
        </div>
    </div>
</body>
</html>
